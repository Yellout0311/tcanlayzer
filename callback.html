<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 로그인 처리중...</title>
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .loading-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #03c75a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h3 { color: #333; margin-bottom: 10px; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h3>네이버 로그인 처리중...</h3>
        <p>잠시만 기다려주세요.</p>
    </div>
    
    <script>
        // 네이버 로그인 처리
        const naverLogin = new naver.LoginWithNaverId({
            clientId: "WuMBjclze0E5qNkGCf7u", // 네이버 developers에서 받은 client id
            callbackUrl: "http://127.0.0.1:5500/callback.html",
            isPopup: false
        });
        
        naverLogin.init();
        
        naverLogin.getLoginStatus(function (status) {
            if (status) {
                const userData = naverLogin.user;
                console.log('네이버 로그인 성공:', userData);
                
                // 사용자 정보를 localStorage에 저장
                const userInfo = {
                    name: userData.name || userData.nickname || '네이버 사용자',
                    email: userData.email || '',
                    provider: 'naver',
                    profileImage: userData.profile_image || '',
                    id: userData.id
                };
                
                localStorage.setItem('naver_login_success', JSON.stringify(userInfo));
                
                // 메인 페이지로 리다이렉트
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } else {
                console.log('네이버 로그인 실패');
                alert('로그인에 실패했습니다. 다시 시도해주세요.');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });
    </script>
</body>
</html>
