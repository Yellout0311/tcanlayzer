<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCAnalyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- 네이버 로그인 SDK -->
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
</head>
<body>
    <!-- 로그인 전 헤더 -->
    <header class="header" id="headerLoggedOut">
        <button onclick="showLogin()">log in</button>
        <button onclick="showSettings()">settings</button>
    </header>

    <!-- 로그인 후 헤더 -->
    <header class="header logged-in-header" id="headerLoggedIn" style="display: none;">
        <div class="user-menu">
            <div class="user-profile" onclick="toggleUserMenu()">
                <div class="user-avatar" id="userAvatar">U</div>
                <span class="user-name" id="userName">사용자</span>
                <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 12 12">
                    <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </div>
            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-item" onclick="showMyPage()">
                    <span>마이 페이지</span>
                </div>
                <div class="dropdown-item" onclick="showSettings()">
                    <span>설정</span>
                </div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item" onclick="logout()">
                    <span>로그아웃</span>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <h1 class="title">TCAnalyzer</h1>
        <p class="subtitle">
            어려분이 사용하는 플랫폼의 <a href="#">약관 분석</a>을 통해 잠재적인 위험 요소를 파악하세요.
        </p>

        <!-- 약관 입력 영역 -->
        <div class="input-section">
            <h2 class="input-title">약관 분석</h2>
            <p class="input-description">분석하고 싶은 약관의 전체 텍스트를 아래에 붙여넣어 주세요. AI가 자동으로 위험 요소와 중요 문구를 분석해드립니다.</p>
            
            <textarea class="text-input" placeholder="분석하고 싶은 약관을 여기에 입력하세요..."></textarea>
            <button class="analyze-button" onclick="analyzeTerms()">분석하기</button>
        </div>

        <!-- 분석 결과 영역 -->
        <div class="result-section" id="resultSection">
            <h3 class="result-title">분석 결과</h3>
            <div id="resultContent"></div>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="tab-container" id="tabContainer">
            <div class="tab-nav">
                <button class="tab active" onclick="switchTab(this, 'summary')">AI 요약</button>
                <button class="tab" onclick="switchTab(this, 'key-phrases')">중요 문구</button>
                <button class="tab" onclick="switchTab(this, 'expert-view')">전문 보기 + 타임라인</button>
            </div>
            <div class="tab-content" id="tabContent">
                이 기능은 현재 개발 중입니다.
            </div>
        </div>
    </div>

    <!-- 로그인 안내 섹션 (로그인 전에만 표시) -->
    <div class="login-notice-section" id="loginNoticeSection">
        <div class="login-notice">
            <h3>🔒 내 약관 보기</h3>
            <p>분석한 약관들을 저장하고 관리하려면 로그인이 필요합니다.</p>
            <button class="login-notice-btn" onclick="showLogin()">로그인하기</button>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>로그인</h2>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form class="login-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required placeholder="example@email.com">
                    </div>
                    <div class="input-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
                    </div>
                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>로그인 상태 유지</span>
                        </label>
                        <a href="#" class="forgot-password">비밀번호 찾기</a>
                    </div>
                    <button type="submit" class="login-btn">로그인</button>
                </form>
                <div class="divider">
                    <span>또는</span>
                </div>
                <div class="social-login">
                    <button class="social-btn google-btn" onclick="socialLogin('google')">
                        <span>Google로 로그인</span>
                    </button>
                    <button class="social-btn kakao-btn" onclick="socialLogin('kakao')">
                        <span>카카오로 로그인</span>
                    </button>
                    <button class="social-btn naver-btn" id="naverLoginBtn">
                        <span>네이버로 로그인</span>
                    </button>
                </div>
                <div class="signup-link">
                    <p>계정이 없으신가요? <a href="#" onclick="showSignup()">회원가입</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 마이페이지 모달 -->
    <div class="modal-overlay" id="myPageModal">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2>마이 페이지</h2>
                <button class="close-btn" onclick="closeMyPageModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="mypage-tabs">
                    <button class="mypage-tab active" onclick="switchMyPageTab(this, 'my-terms')">내 약관 보기</button>
                    <button class="mypage-tab" onclick="switchMyPageTab(this, 'profile')">프로필</button>
                </div>
                <div class="mypage-content" id="myPageContent">
                    <!-- 내 약관 보기가 여기에 표시됩니다 -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
