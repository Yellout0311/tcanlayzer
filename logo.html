<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzer Logo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        
        .logo-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .logo {
            width: 140px;
            height: 140px;
            background: #8B7355;
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .logo-symbol {
            position: relative;
            width: 80px;
            height: 80px;
        }
        
        /* 추상적인 A 형태 + 분석 라인들 */
        .shape-1 {
            position: absolute;
            width: 3px;
            height: 50px;
            background: white;
            left: 20px;
            top: 15px;
            transform: rotate(-15deg);
            border-radius: 2px;
        }
        
        .shape-2 {
            position: absolute;
            width: 3px;
            height: 50px;
            background: white;
            right: 20px;
            top: 15px;
            transform: rotate(15deg);
            border-radius: 2px;
        }
        
        .shape-3 {
            position: absolute;
            width: 30px;
            height: 3px;
            background: white;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        
        /* 분석을 상징하는 작은 도트들 */
        .dot-1 {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            right: 8px;
            top: 8px;
        }
        
        .dot-2 {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            right: 15px;
            top: 15px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #8B7355;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #75614A;
            transform: translateY(-1px);
        }
        
        .info {
            text-align: center;
            color: #666;
            max-width: 400px;
            line-height: 1.6;
        }
        
        .download-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1 style="color: #8B7355; margin-bottom: 30px;">Analyzer Logo</h1>
    
    <div class="controls">
        <button onclick="changeDesign(1)">디자인 1: 추상 A</button>
        <button onclick="changeDesign(2)">디자인 2: 기하학적</button>
        <button onclick="changeDesign(3)">디자인 3: 분석 라인</button>
        <button onclick="downloadLogo()">PNG 다운로드</button>
    </div>
    
    <div class="logo-container">
        <div class="logo" id="logo">
            <div class="logo-symbol" id="logoSymbol">
                <div class="shape-1"></div>
                <div class="shape-2"></div>
                <div class="shape-3"></div>
                <div class="dot-1"></div>
                <div class="dot-2"></div>
            </div>
        </div>
    </div>
    
    <div class="info">
        <p><strong>컬러:</strong> Pantone 17-1230 Mocha Mousse (#8B7355)</p>
        <p><strong>사이즈:</strong> 140x140px</p>
        <p><strong>컨셉:</strong> 미니멀하면서 따뜻한 분석 도구의 상징</p>
        
        <div class="download-info">
            💡 <strong>다운로드 안내:</strong><br>
            "PNG 다운로드" 버튼을 클릭하면 140x140px, 투명 배경의 PNG 파일이 다운로드됩니다.<br>
            파일 크기는 자동으로 500KB 이하로 최적화됩니다.
        </div>
    </div>

    <script>
        function changeDesign(designNumber) {
            const logoSymbol = document.getElementById('logoSymbol');
            
            // 기존 내용 제거
            logoSymbol.innerHTML = '';
            
            if (designNumber === 1) {
                // 추상 A 디자인
                logoSymbol.innerHTML = `
                    <div class="shape-1" style="position: absolute; width: 3px; height: 50px; background: white; left: 20px; top: 15px; transform: rotate(-15deg); border-radius: 2px;"></div>
                    <div class="shape-2" style="position: absolute; width: 3px; height: 50px; background: white; right: 20px; top: 15px; transform: rotate(15deg); border-radius: 2px;"></div>
                    <div class="shape-3" style="position: absolute; width: 30px; height: 3px; background: white; left: 50%; top: 40px; transform: translateX(-50%); border-radius: 2px;"></div>
                    <div class="dot-1" style="position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.7); border-radius: 50%; right: 8px; top: 8px;"></div>
                    <div class="dot-2" style="position: absolute; width: 3px; height: 3px; background: rgba(255,255,255,0.5); border-radius: 50%; right: 15px; top: 15px;"></div>
                `;
            } else if (designNumber === 2) {
                // 기하학적 블록 디자인
                logoSymbol.innerHTML = `
                    <div style="position: absolute; width: 20px; height: 20px; background: white; left: 15px; top: 20px; border-radius: 3px;"></div>
                    <div style="position: absolute; width: 20px; height: 20px; background: rgba(255,255,255,0.8); left: 40px; top: 20px; border-radius: 3px;"></div>
                    <div style="position: absolute; width: 20px; height: 20px; background: rgba(255,255,255,0.6); right: 15px; top: 20px; border-radius: 3px;"></div>
                    <div style="position: absolute; width: 50px; height: 3px; background: white; left: 50%; top: 50px; transform: translateX(-50%); border-radius: 2px;"></div>
                `;
            } else if (designNumber === 3) {
                // 분석 라인 디자인
                logoSymbol.innerHTML = `
                    <div style="position: absolute; width: 40px; height: 2px; background: white; left: 20px; top: 25px; border-radius: 1px;"></div>
                    <div style="position: absolute; width: 30px; height: 2px; background: rgba(255,255,255,0.8); left: 25px; top: 35px; border-radius: 1px;"></div>
                    <div style="position: absolute; width: 35px; height: 2px; background: rgba(255,255,255,0.6); left: 22px; top: 45px; border-radius: 1px;"></div>
                    <div style="position: absolute; width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; right: 15px; top: 30px; background: transparent;"></div>
                `;
            }
        }
        
        function downloadLogo() {
            // Canvas 생성
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 140;
            canvas.height = 140;
            
            // 현재 선택된 디자인 확인
            const logoSymbol = document.getElementById('logoSymbol');
            const currentDesign = logoSymbol.innerHTML;
            
            // 배경 그리기 (Mocha Mousse 색상)
            ctx.fillStyle = '#8B7355';
            ctx.roundRect(0, 0, 140, 140, 20);
            ctx.fill();
            
            // 현재 디자인에 따라 그리기
            ctx.fillStyle = 'white';
            
            if (currentDesign.includes('shape-1')) {
                // 디자인 1: 추상 A
                drawRotatedRect(ctx, 28, 40, 3, 50, -15);
                drawRotatedRect(ctx, 108, 40, 3, 50, 15);
                ctx.fillRect(55, 78, 30, 3);
                
                // 도트들
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(132, 16, 2, 0, 2 * Math.PI);
                ctx.fill();
                
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(125, 23, 1.5, 0, 2 * Math.PI);
                ctx.fill();
                ctx.globalAlpha = 1;
                
            } else if (currentDesign.includes('border-radius: 50%')) {
                // 디자인 3: 분석 라인
                ctx.fillRect(28, 48, 40, 2);
                
                ctx.globalAlpha = 0.8;
                ctx.fillRect(33, 58, 30, 2);
                
                ctx.globalAlpha = 0.6;
                ctx.fillRect(30, 68, 35, 2);
                
                ctx.globalAlpha = 1;
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(125, 60, 6, 0, 2 * Math.PI);
                ctx.stroke();
                
            } else {
                // 디자인 2: 기하학적 블록
                ctx.fillRect(23, 40, 20, 20);
                
                ctx.globalAlpha = 0.8;
                ctx.fillRect(48, 40, 20, 20);
                
                ctx.globalAlpha = 0.6;
                ctx.fillRect(97, 40, 20, 20);
                
                ctx.globalAlpha = 1;
                ctx.fillRect(45, 78, 50, 3);
            }
            
            // 다운로드
            const link = document.createElement('a');
            link.download = 'analyzer-logo-140x140.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function drawRotatedRect(ctx, x, y, width, height, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle * Math.PI / 180);
            ctx.fillRect(-width/2, -height/2, width, height);
            ctx.restore();
        }
        
        // CanvasRenderingContext2D에 roundRect 메서드가 없는 경우를 위한 폴리필
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
        }
    </script>
</body>
</html>
