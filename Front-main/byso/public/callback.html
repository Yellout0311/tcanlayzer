<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 처리중...</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #03c75a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h3>네이버 로그인 처리 중...</h3>
        <p>잠시만 기다려주세요.</p>
        <div id="status"></div>
    </div>
    
    <script>
        console.log('=== 네이버 로그인 콜백 처리 시작 ===');
        
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message) {
            console.log(message);
            statusDiv.innerHTML += '<br><small>' + message + '</small>';
        }
        
        // URL 파라미터 확인
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        updateStatus('URL: ' + window.location.href);
        updateStatus('Code: ' + (code ? '있음' : '없음'));
        updateStatus('Error: ' + (error || '없음'));
        
        // 에러 처리
        if (error) {
            updateStatus('❌ 로그인 취소 또는 에러');
            alert('로그인이 취소되었습니다.');
            setTimeout(function() {
                window.location.href = '/'; // 리액트 루트로 변경
            }, 2000);
        }
        // 성공 처리
        else if (code) {
            updateStatus('✅ 인증 코드 받음');
            
            // 네이버에서 실제 사용자 정보를 받아오는 대신
            // 테스트용 사용자 정보 생성
            const userInfo = {
                name: '네이버 사용자',
                email: 'test@naver.com',
                provider: 'naver',
                profileImage: '',
                id: 'naver_' + Date.now(),
                loginTime: new Date().toISOString()
            };
            
            updateStatus(' 사용자 정보 저장 중...');
            localStorage.setItem('naver_login_success', JSON.stringify(userInfo));
            
            updateStatus(' 메인 페이지로 이동...');
            
            setTimeout(function() {
                window.location.href = '/App.js'; 
            }, 2000);
        }
        // 예외 상황
        else {
            updateStatus('❓ 알 수 없는 상태');
            alert('로그인 처리 중 오류가 발생했습니다.');
            setTimeout(function() {
                window.location.href = '/App.js'; 
            }, 2000);
        }
    </script>
</body>
</html>
